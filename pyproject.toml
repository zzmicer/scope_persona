[project]
name = "daydream-scope"
version = "0.1.3"
description = "A tool for running and customizing real-time, interactive generative AI pipelines and models"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Yondon Fu", email = "yondon@livepeer.org"},
    {name = "Rafal Leszko", email = "rafal@livepeer.org"}
]
maintainers = [
    {name = "Yondon Fu", email = "yondon@livepeer.org"},
    {name = "Rafal Leszko", email = "rafal@livepeer.org"}
]
keywords = ["ai", "video", "streaming", "webrtc", "diffusion", "real-time"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiortc>=1.13.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "twilio>=9.8.0",
    "uvicorn>=0.35.0",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "easydict>=1.13",
    "diffusers>=0.31.0",
    "ftfy>=6.3.1",
    "transformers>=4.49.0",
    "einops>=0.8.1",
    "lmdb>=1.7.3",
    "omegaconf>=2.3.0",
    "accelerate>=1.1.1",
    "flash-attn==2.8.3; sys_platform == 'linux' or sys_platform == 'win32'",
    "sageattn3>=1.0.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "safetensors>=0.6.2",
    "huggingface_hub>=0.25.0",
    "pluggy>=1.5.0",
    "click>=8.3.1",
    "peft>=0.17.1",
    "torchao==0.15.0",
    "kernels>=0.10.4",
    "triton==3.5.1; sys_platform == 'linux'",
    "triton-windows==3.5.1.post24; sys_platform == 'win32'",
    "SpoutGL>=0.1.1; sys_platform == 'win32'",
    "PyOpenGL>=3.1.10; sys_platform == 'win32'",
]

[project.optional-dependencies]
kafka = [
    "aiokafka>=0.10.0",
]
# LingBot-World-V2 runtime helpers. The model itself and its GPU-specific
# dependencies are installed separately on the H200 host; this extra captures
# the small Python packages that the released inference code imports.
# Install with: uv sync --extra lingbot
lingbot = [
    "scipy>=1.14.0; sys_platform == 'linux'",
    "easydict>=1.13",
    "ftfy>=6.3.1",
]
# LongLive 2.0 NVFP4 (Blackwell-only) backend. TransformerEngine installs from
# PyPI; FourOverSix and the KV-dequant CUDA extension are source-built on the pod
# (see src/scope/core/pipelines/wan2_2/nvfp4/README.md). flash-attn / triton are
# already core deps. Install with: uv sync --extra longlive2-nvfp4
longlive2-nvfp4 = [
    "transformer-engine[pytorch]>=1.13; sys_platform == 'linux'",
]
# OmniForcing (LTX-2 causal audio-video). The LTX model code is NOT vendored
# (LTX-2 Community License); it is installed from the OmniForcing repo as three
# source packages (see [tool.uv.sources] below) plus audio deps. GPU host only
# (H100/H200 class). Install with: uv sync --extra omniforcing
# See src/scope/core/pipelines/omniforcing/docs/usage.md.
omniforcing = [
    "ltx-core; sys_platform == 'linux'",
    "ltx-causal; sys_platform == 'linux'",
    "ltx-distillation; sys_platform == 'linux'",
    "soundfile; sys_platform == 'linux'",
    "sentencepiece; sys_platform == 'linux'",
    # ltx-core imports torchaudio (audio VAE ops). Pin it to the torch build —
    # left unpinned, resolution pulls torchaudio 2.11 (PyPI) whose C++ extension
    # is ABI-incompatible with our torch 2.9.1+cu128 and fails to load. The
    # cu128-index source (below) keeps it matched to torch. Verified on H100 pod.
    "torchaudio==2.9.1; sys_platform == 'linux'",
]

[project.scripts]
daydream-scope = "scope.server.app:main"
build = "scope.server.build:main"
download_models = "scope.server.download_models:main"

[project.urls]
Homepage = "https://github.com/daydreamlive/scope"
Repository = "https://github.com/daydreamlive/scope"
Issues = "https://github.com/daydreamlive/scope/issues"

[tool.uv]
preview = true
# Override cuDNN version to fix PyTorch 2.9.1 Conv3D bf16 performance regression
# See: https://github.com/pytorch/pytorch/issues/168167
override-dependencies = [
    "nvidia-cudnn-cu12>=9.15; sys_platform == 'linux' or sys_platform == 'win32'",
]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true, marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
sageattn3 = ["torch"]

[[tool.uv.dependency-metadata]]
# Static metadata so uv can resolve without building from source (requires CUDA toolkit)
name = "sageattn3"
version = "1.0.0"
requires-dist = ["torch"]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
flash-attn = [
    # Prebuilt Linux wheels from https://github.com/Dao-AILab/flash-attention
    { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux'" },
    # Prebuilt Windows wheels from https://github.com/kingbri1/flash-attention
    { url = "https://github.com/kingbri1/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu128torch2.9.0cxx11abiFALSE-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32'" },
]
sageattn3 = [
    # SA3 (SageAttention 3.0) — no prebuilt wheels yet; source install from
    # the sageattention3_blackwell subdirectory of the main repo.
    { git = "https://github.com/thu-ml/SageAttention", subdirectory = "sageattention3_blackwell", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
# OmniForcing LTX-2 packages — source-installed from the OmniForcing monorepo
# (uv workspace). ltx-distillation pulls in ltx-core + ltx-pipelines by name, so
# all four are mapped here. Linux/pod only. See the `omniforcing` extra above.
ltx-core = [
    { git = "https://github.com/OmniForcing/OmniForcing", subdirectory = "LTX-2/packages/ltx-core", marker = "sys_platform == 'linux'" },
]
ltx-causal = [
    { git = "https://github.com/OmniForcing/OmniForcing", subdirectory = "LTX-2/packages/ltx-causal", marker = "sys_platform == 'linux'" },
]
ltx-pipelines = [
    { git = "https://github.com/OmniForcing/OmniForcing", subdirectory = "LTX-2/packages/ltx-pipelines", marker = "sys_platform == 'linux'" },
]
ltx-distillation = [
    { git = "https://github.com/OmniForcing/OmniForcing", subdirectory = "LTX-2/packages/ltx-distillation", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "ruff==0.14.11",
    "pre-commit>=4.0.0",
    "twine>=5.0.0",
    "pytest>=8.4.2",
    "freezegun>=1.5.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    "*/vendor/*",
    "**/vendor/**",
    "*/modules/*",
    "**/modules/**",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
    "B008", # function call in argument defaults (FastAPI Depends pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scope"]

[tool.hatch.build.targets.wheel.force-include]
# Include .pth file for automatic cuDNN patching at Python startup
"patches.pth" = "patches.pth"

[tool.hatch.build]
include = [
    "frontend/dist/assets/**/*",
    "frontend/dist/index.html",
    "./README.md",
    "./LICENSE.md",
    "*.toml",
    ".python-version",
    "./*.yaml",
    "./*.yml",
    "./*.json",
]

exclude = [
    "__pycache__/**/*",
    "*.pyc",
    "*.pyo",
    "*.pyd",
    ".pytest_cache/**/*",
    ".coverage",
    "htmlcov/**/*",
    ".tox/**/*",
    ".venv/**/*",
    "venv/**/*",
    "env/**/*",
    ".env",
    ".env.*",
    "*.egg-info/**/*",
    "dist/**/*",
    "build/**/*",
    "models/**/*",
]
